[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datashare-software-stack-updater"
version = "0.1.0"
description = "EasyBuild inventory generator and local ODS reconciler for DSS software-stack sheets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "odfpy>=1.4.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
dss-update = "dss_updater.cli:main"
dss-inventory = "dss_updater.inventory_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
